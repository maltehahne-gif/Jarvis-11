<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Core 0.1 — Debug</title>
<!--
  Deliberately plain. DoD 5.4 says "Keine UI außer minimalem Debug-Dashboard ist
  für diesen Meilenstein nötig", and Principle 5 is "build core before
  spectacle". The HUD from Blueprint 3 is a later phase; this page exists only
  to make the Core's events, verdicts and mission states observable.
-->
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --fg:#d6dae0; --dim:#7a828c;
          --amber:#e8a13a; --cyan:#4bb3d4; --red:#d4574b; --green:#5cae7a;
          --line:#1c2128; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5
         ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding:12px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:13px; margin:0; letter-spacing:.18em; color:var(--amber); }
  .meta { color:var(--dim); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
         min-height:calc(100vh - 49px); }
  section { background:var(--bg); padding:12px 16px; overflow:auto; max-height:calc(100vh - 49px); }
  h2 { font-size:11px; letter-spacing:.16em; color:var(--dim); margin:0 0 10px;
       text-transform:uppercase; font-weight:400; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input[type=text] { flex:1; background:#11151a; border:1px solid var(--line);
                     color:var(--fg); padding:8px 10px; font:inherit; border-radius:3px; }
  input[type=text]:focus { outline:1px solid var(--cyan); }
  button { background:#11151a; border:1px solid var(--line); color:var(--fg);
           padding:8px 12px; font:inherit; cursor:pointer; border-radius:3px; }
  button:hover { border-color:var(--cyan); color:#fff; }
  .row { border-bottom:1px solid var(--line); padding:6px 0; }
  .t { color:var(--cyan); }
  .dim { color:var(--dim); }
  .amber { color:var(--amber); }
  .red { color:var(--red); }
  .green { color:var(--green); }
  pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--dim); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:4px 8px 4px 0; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { color:var(--dim); font-weight:400; font-size:11px; text-transform:uppercase; }
  .pending { border:1px solid var(--amber); padding:8px; margin-bottom:8px; border-radius:3px; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S. CORE 0.1</h1>
  <span class="meta" id="conn">verbinde…</span>
  <span class="meta" id="killswitch"></span>
  <span class="meta" id="counts"></span>
</header>

<main>
  <section>
    <h2>Kommando</h2>
    <form id="cmd">
      <input type="text" id="text" placeholder="z. B. Licht im Office an" autocomplete="off" autofocus>
      <input type="text" id="grants" placeholder="scopes" size="10" title="z. B. comms,secrets">
      <button type="submit">senden</button>
    </form>
    <div id="pending"></div>
    <h2>Antworten</h2>
    <div id="replies"></div>
  </section>

  <section>
    <h2>Live-Events</h2>
    <div id="events"></div>
  </section>

  <section>
    <h2>Missionen</h2>
    <div id="missions"></div>
  </section>

  <section>
    <h2>Capabilities</h2>
    <div id="caps"></div>
  </section>

  <section>
    <h2>Scheduler</h2>
    <div id="jobs"></div>
  </section>

  <section>
    <h2>What JARVIS Knows</h2>
    <div id="privacy"></div>
    <div id="routines"></div>
    <div id="knows"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- live event stream -----------------------------------------------------
// Renders only what the Core published. Nothing here fabricates status.
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen  = () => $('conn').textContent = 'verbunden';
  ws.onclose = () => { $('conn').textContent = 'getrennt — neuer Versuch…'; setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    const cls = e.type.includes('denied') || e.type.includes('failed') ? 'red'
              : e.type.includes('passed') || e.type.includes('succeeded') ? 'green'
              : e.type.includes('confirmation') || e.type.includes('kill') ? 'amber' : 't';
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<span class="${cls}">${esc(e.type)}</span>
      <span class="dim">${esc(e.timestamp.slice(11,19))} · ${esc(e.source)} · ${esc(e.priority)}</span>
      <pre>${esc(JSON.stringify(e.payload))}</pre>`;
    $('events').prepend(el);
    while ($('events').children.length > 200) $('events').lastChild.remove();
    refreshSoon();
  };
}
connect();

// ---- command ---------------------------------------------------------------
$('cmd').onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  const grants = $('grants').value.split(',').map(s => s.trim()).filter(Boolean);
  $('text').value = '';
  const res = await fetch('/command', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text, grants, device_id: 'debug-dashboard' })
  });
  showReply(text, await res.json());
  refresh();
};

function showReply(text, r) {
  const v = r.execution && r.execution.verification;
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `<div><span class="dim">&gt;</span> ${esc(text)}</div>
    <div class="amber">${esc(r.message)}</div>
    <div class="dim">${esc(r.mission_state || '')} ${r.intent ? '· route=' + esc(r.intent.route) : ''}
      ${v ? '· verify=' + esc(v.status) + (v.tool_reported_success && !v.goal_reached
            ? ' <span class="red">(Tool meldete Erfolg)</span>' : '') : ''}</div>`;
  $('replies').prepend(el);
}

// ---- pending approvals -----------------------------------------------------
async function refresh() {
  const s = await (await fetch('/status')).json();
  $('killswitch').innerHTML = s.kill_switch
    ? '<span class="red">KILL SWITCH AKTIV</span>' : '';
  $('counts').textContent = `${s.events_published} events · ${s.active_missions.length} aktiv`;

  $('pending').innerHTML = s.pending_approvals.map(p => `
    <div class="pending">
      <div class="amber">Freigabe nötig: ${esc(p.capability)} <span class="dim">(${esc(p.confirmation)})</span></div>
      <pre>${esc(JSON.stringify(p.params))}</pre>
      <button onclick="decide('approve','${esc(p.fingerprint)}',${p.confirmation === 'strong'})">freigeben</button>
      <button onclick="decide('deny','${esc(p.fingerprint)}',false)">ablehnen</button>
    </div>`).join('');

  // Missions show plan progress: how many steps, how far, how many
  // checkpoints. Blueprint 3.2's Mission view wants goal tree, dependencies
  // and checkpoints - this is the debug-grade version of that.
  const missions = await (await fetch('/missions?limit=15')).json();
  $('missions').innerHTML =
    '<table><tr><th>Ziel</th><th>Status</th><th>Fortschritt</th><th>Plan</th></tr>' +
    missions.map(m => {
      const cls = m.state === 'COMPLETED' ? 'green'
                : ['FAILED','BLOCKED','CANCELED'].includes(m.state) ? 'red' : 'amber';
      const done = m.tasks.filter(t => t.state === 'DONE').length;
      const failed = m.tasks.filter(t => t.state === 'FAILED').length;
      const skipped = m.tasks.filter(t => t.state === 'SKIPPED').length;
      const plan = m.context && m.context.plan;
      // Only PAUSED. A BLOCKED mission was refused by the Permission Engine,
      // and re-running it unchanged would simply be refused again - what it
      // needs is a grant or an approval, not another attempt.
      const resumable = m.state === 'PAUSED';
      return `<tr>
        <td>${esc(m.goal)}
          ${resumable ? `<button onclick="resumeMission('${esc(m.mission_id)}')">fortsetzen</button>` : ''}</td>
        <td class="${cls}">${esc(m.state)}</td>
        <td class="dim">${done}/${m.tasks.length}
          ${failed ? `<span class="red">${failed} fehlgeschlagen</span>` : ''}
          ${skipped ? `<span class="dim">${skipped} übersprungen</span>` : ''}
          ${(m.checkpoints || []).length ? `· ${m.checkpoints.length} ⚑` : ''}</td>
        <td class="dim">${plan ? esc(plan.source) + ' · ' + esc(plan.max_risk) : '—'}</td>
      </tr>`;
    }).join('') + '</table>';

  await refreshJobs();
  await refreshMemory();
}

// ---- scheduler (Blueprint 5.1) ---------------------------------------------
async function refreshJobs() {
  const s = await (await fetch('/scheduler')).json();
  const rows = s.jobs.map(j => {
    const state = !j.enabled ? '<span class="red">aus</span>'
                : j.needs_approval_each_run ? '<span class="amber">parkt</span>'
                : '<span class="green">aktiv</span>';
    return `<tr>
      <td>${esc(j.name)} <span class="dim">${esc(j.kind)}</span></td>
      <td>${state}</td>
      <td class="dim">${esc((j.next_run_at || '').slice(11,19))}</td>
      <td class="dim">${j.attempts ? j.attempts + '/' + j.max_attempts : '—'}</td>
      <td class="dim">${esc(j.last_outcome || '—')}</td>
      <td><button onclick="removeJob('${esc(j.job_id)}')">löschen</button></td>
    </tr>`;
  }).join('');

  $('jobs').innerHTML =
    `<div class="dim">${s.total} Jobs · ${s.enabled} aktiv · ${s.needing_approval} brauchen Freigabe
      · unbeaufsichtigt max. ${esc(s.max_unattended_level)}</div>
     <button onclick="tickScheduler()">jetzt fällige ausführen</button>
     <button onclick="sweepWatchdog()">Watchdog-Sweep</button>` +
    (s.total ? `<table><tr><th>Job</th><th></th><th>nächster Lauf</th><th>Versuche</th>
       <th>zuletzt</th><th></th></tr>${rows}</table>` : '');
}

async function tickScheduler() {
  const rs = await (await fetch('/scheduler/tick', { method: 'POST' })).json();
  showReply('scheduler tick', {
    message: rs.length ? rs.map(r => `${r.outcome}: ${r.detail}`).join(' · ') : 'nichts fällig'
  });
  refresh();
}

async function sweepWatchdog() {
  const r = await (await fetch('/watchdog/sweep', { method: 'POST' })).json();
  showReply('watchdog', {
    message: `${r.checked} laufend geprüft, ${r.tripped.length} abgebrochen`
  });
  refresh();
}

async function removeJob(id) {
  await fetch(`/scheduler/jobs/${id}`, { method: 'DELETE' });
  refreshJobs();
}

async function resumeMission(id) {
  const r = await (await fetch(`/missions/${id}/resume`, { method: 'POST' })).json();
  showReply('fortsetzen', r);
  refresh();
}

// ---- "What JARVIS Knows" (Blueprint 8.4) -----------------------------------
// Shows source, confidence and last confirmation for every belief, plus the
// five actions and the three privacy switches the blueprint names.
async function refreshMemory() {
  const p = await (await fetch('/memory/privacy')).json();
  const sw = (key, label) => `<button onclick="togglePrivacy('${key}', ${!p[key]})">
    ${p[key] ? '<span class="green">on</span>' : '<span class="red">off</span>'} ${label}</button>`;
  $('privacy').innerHTML =
    sw('learn_behaviour', 'Verhalten lernen') + ' ' +
    sw('conversation_memory', 'Gesprächs-Memory') + ' ' +
    sw('screen_camera_learning', 'Screen/Kamera') +
    ` <button onclick="forgetWindow(30)">vergiss die letzten 30 min</button>`;

  const routines = await (await fetch('/memory/routines')).json();
  $('routines').innerHTML = routines.map(r => `
    <div class="pending">
      <div class="amber">Routine vorgeschlagen: ${esc(r.capability)} <span class="dim">${esc(r.trigger)}</span></div>
      <div class="dim">${esc(r.rationale)}</div>
      <button onclick="decideRoutine('${esc(r.proposal_id)}', true)">übernehmen</button>
      <button onclick="decideRoutine('${esc(r.proposal_id)}', false)">verwerfen</button>
    </div>`).join('');

  const m = await (await fetch('/memory?limit=40')).json();
  const s = m.summary;
  $('knows').innerHTML =
    `<div class="dim">${s.total} Einträge · ${s.actionable} belastbar · ${s.pinned} gepinnt</div>` +
    '<table><tr><th>Typ</th><th>Wissen</th><th>Conf</th><th>Quelle</th><th></th></tr>' +
    m.entries.map(e => {
      const conf = e.actionable ? 'green' : 'dim';
      return `<tr>
        <td class="dim">${esc(e.type)}</td>
        <td>${esc(e.subject)} · ${esc(e.predicate)} <span class="amber">${esc(JSON.stringify(e.value))}</span>
            ${e.pinned ? '<span class="cyan">📌</span>' : ''}
            ${e.sensitivity === 'secret' ? '<span class="red">secret</span>' : ''}</td>
        <td class="${conf}">${e.confidence.toFixed(2)}<span class="dim">/${e.observations}</span></td>
        <td class="dim">${esc(e.source)}</td>
        <td><button onclick="memAction('${esc(e.memory_id)}','pin')">pin</button>
            <button onclick="memAction('${esc(e.memory_id)}','forget')">vergiss</button></td>
      </tr>`;
    }).join('') + '</table>';
}

async function togglePrivacy(key, value) {
  await fetch('/memory/privacy', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ [key]: value })
  });
  refreshMemory();
}

async function memAction(id, action) {
  await fetch(`/memory/${id}/${action}`, { method: 'POST' });
  refreshMemory();
}

async function forgetWindow(minutes) {
  const r = await (await fetch('/memory/forget-window', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ minutes })
  })).json();
  showReply(`vergiss die letzten ${minutes} min`,
    { message: `${r.deleted_count} Einträge gelöscht, ${r.protected_pinned} gepinnt geschützt` });
  refreshMemory();
}

async function decideRoutine(id, approve) {
  await fetch(`/memory/routines/${id}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ approve })
  });
  refreshMemory();
}

async function decide(action, fingerprint, strong) {
  const res = await fetch('/' + action, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ fingerprint, strong, device_id: 'debug-dashboard' })
  });
  showReply(action, await res.json());
  refresh();
}

let timer;
const refreshSoon = () => { clearTimeout(timer); timer = setTimeout(refresh, 250); };

(async () => {
  const caps = await (await fetch('/capabilities')).json();
  $('caps').innerHTML = '<table><tr><th>Capability</th><th>Level</th><th>Scopes</th><th>Verify</th></tr>' +
    caps.map(c => `<tr><td>${esc(c.name)}</td>
      <td class="${c.level === 'P6' ? 'red' : c.level >= 'P3' ? 'amber' : 'dim'}">${esc(c.level)} ${esc(c.level_label)}</td>
      <td class="dim">${esc(c.required_grants.join(',') || '—')}</td>
      <td class="dim">${c.verifiable ? 'ja' : 'nein'}</td></tr>`).join('') + '</table>';
  refresh();
})();
</script>
</body>
</html>
